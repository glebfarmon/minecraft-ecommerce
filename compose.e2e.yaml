services:
  traefik:
    volumes: !override
      - ./infra/traefik/e2e.yml:/etc/traefik/dynamic.yml:ro

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args: {APP_VERSION: e2e}
    command: ['sh', '-c', 'node_modules/.bin/prisma migrate deploy && node dist/seed/main.js']
    environment:
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
      # The seed mails the owner invite through Mailpit; the link points at the admin origin.
      BETTER_AUTH_URL: http://admin.shop.localhost
      ADMIN_OWNER_EMAIL: owner@shop.localhost
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: Shop <no-reply@shop.localhost>
    depends_on:
      postgres: {condition: service_healthy}
      mailpit: {condition: service_started}
    healthcheck: {disable: true}

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args: {APP_VERSION: e2e}
    environment:
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
      # Test values: the image runs with NODE_ENV=production, which refuses auth fallbacks.
      BETTER_AUTH_SECRET: e2e-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://admin.shop.localhost
      REDIS_URL: redis://redis:6379
      ADMIN_OWNER_EMAIL: owner@shop.localhost
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: Shop <no-reply@shop.localhost>
      # The e2e signs the owner in several times from one IP; spec limits (3 codes / 10 min per email,
      # 10 / h per IP) would trip a rerun. Production keeps the defaults.
      RATE_LIMIT_OTP_EMAIL: '100'
      RATE_LIMIT_OTP_IP: '100'
      # The web server fetches the catalog and content from one IP; with 1 s cache lifetimes and
      # parallel workers it passes 100 requests/min, a 429 keeps the stale page and the e2e that
      # waits for an admin edit on the storefront times out.
      RATE_LIMIT_DEFAULT: '10000'
      # Parallel workers create orders from one IP; the production limit would trip them.
      RATE_LIMIT_ORDER: '1000'
      # The e2e pays through the fake gateway, which signs real Stripe-format events.
      PAYMENTS_GATEWAY: fake
      PAYMENTS_ALLOW_FAKE: 'true'
      # e2e only: signs fake events, never used anywhere else.
      STRIPE_WEBHOOK_SECRET: whsec_e2e_throwaway
      PUBLIC_WEB_ORIGIN: http://shop.localhost
      # Cloudflare's documented always-pass Turnstile test secret.
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      # e2e only: a throwaway key, never used anywhere else.
      RCON_ENCRYPTION_KEY: MEUuxU2yK9jLs4j3q7S+m6vFcpMJynMOdcvcUMTkKQs=
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      mailpit: {condition: service_started}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_ORIGIN: http://api:4000
      # Content (rules, texts, settings) refreshes after a second, so the e2e need not wait a minute.
      CONTENT_REVALIDATE_SECONDS: '1'
      # Same for the catalog, so a product the e2e just enabled shows on the storefront within seconds.
      CATALOG_REVALIDATE_SECONDS: '1'
      # Cloudflare's documented always-pass Turnstile test site key.
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    depends_on:
      api: {condition: service_healthy}

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      API_ORIGIN: http://api:4000
    depends_on:
      api: {condition: service_healthy}
