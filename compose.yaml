name: shop

services:
  traefik:
    image: traefik:v3
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --log.level=INFO
    ports: ['80:80']
    volumes:
      - ./infra/traefik/dev.yml:/etc/traefik/dynamic.yml:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shop']
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'noeviction'
      ]
    ports: ['127.0.0.1:6379:6379']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']

  # The delivery worker (ADR 0011): the api image with another command. Opt-in, so a plain
  # `docker compose up -d` still starts only the dev services:
  # `docker compose --profile worker up -d --build worker` (after `pnpm --filter @shop/api exec prisma migrate deploy`).
  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/worker-main.js']
    environment:
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: Shop <no-reply@shop.localhost>
      RCON_ENCRYPTION_KEY: ${RCON_ENCRYPTION_KEY:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mailpit: {condition: service_started}
    # No HTTP server: the image's healthcheck probes port 4000.
    healthcheck: {disable: true}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
